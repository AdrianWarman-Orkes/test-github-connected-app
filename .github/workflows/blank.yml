# .github/workflows/format-workflow-defs.yml
  name: Format workflow defs
  on:
    push:
      branches:
        - 'update-*'

  jobs:
    format:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref_name }}
        - name: Pretty-print JSON
          run: |
            find workflow-defs -name '*.json' -exec sh -c 'jq . "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;
        - name: Commit if changed
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git diff --quiet || (git add -A && git commit -m "chore: pretty-print workflow def" && git push)
